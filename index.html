<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Resumen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4ed8'/%3E%3Cpath d='M16 44V30M28 44V20M40 44V26M52 44V14' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --tx:#1c2430; --mut:#667085; --line:#e4e7ec; --ac:#1d4ed8; --ok:#067647; --bad:#b42318; --amar:#a16207; --barra:#c7d2fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2128; --tx:#e8ebf0; --mut:#98a2b3; --line:#2f3641; --ac:#7aa2ff; --ok:#47cd89; --bad:#f97066; --amar:#facc15; --barra:#33447a; } }
  * { box-sizing:border-box }
  html { -webkit-text-size-adjust:100% }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--tx); }
  main { max-width:560px; margin:0 auto; padding:16px 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size:19px; margin:4px 0 2px } h2 { font-size:13px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--mut); margin:26px 2px 8px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px }
  .k { color:var(--mut); font-size:13px } .v { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px }
  .grande { font-size:32px }
  .rejilla { display:grid; grid-template-columns:1fr 1fr; gap:10px } .rejilla .card { margin:0 } .rejilla .v { font-size:19px }
  .fila { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line); align-items:baseline }
  .fila:first-child { border-top:0 } .fila .n { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600 }
  .fila .q { min-width:0; overflow-wrap:anywhere } .sub { color:var(--mut); font-size:12.5px }
  .ok { color:var(--ok) } .bad { color:var(--bad) } .amar { color:var(--amar) } .mut { color:var(--mut) }
  .nota { font-size:13px; color:var(--mut); margin:8px 2px 0 }
  .aviso { border-left:4px solid var(--amar); } .aviso.bad { border-left-color:var(--bad); color:var(--tx) }
  .barra { height:10px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:8px } .barra i { display:block; height:100%; background:var(--ac); border-radius:99px }
  .meses { display:flex; align-items:flex-end; gap:6px; height:130px; margin-top:10px }
  .meses div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0 }
  .meses b { display:block; width:100%; background:var(--barra); border-radius:5px 5px 2px 2px; min-height:2px } .meses .hoy b { background:var(--ac) }
  .meses span { font-size:11px; color:var(--mut); margin-top:4px } .meses em { font-style:normal; font-size:10.5px; color:var(--mut); margin-bottom:3px; white-space:nowrap }
  details summary { cursor:pointer; color:var(--ac); font-size:14px; padding:6px 0; list-style:none } details summary::-webkit-details-marker { display:none }
  details summary::before { content:"▸ " } details[open] summary::before { content:"▾ " }
  .etq { display:inline-block; font-size:11.5px; font-weight:650; padding:1px 8px; border-radius:99px; border:1px solid currentColor; white-space:nowrap }
  /* Pantalla de clave */
  #candado { min-height:80vh; display:flex; flex-direction:column; justify-content:center }
  #candado input[type=password] { width:100%; font:inherit; font-size:17px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--tx); margin:14px 0 10px }
  #candado label { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--mut) }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 16px; background:var(--ac); color:#fff; width:100%; margin-top:14px; cursor:pointer }
  button.sec { background:transparent; color:var(--ac); border:1px solid var(--line) } button:disabled { opacity:.6 }
  #error { color:var(--bad); font-size:14px; min-height:20px; margin-top:8px }
  .oculto { display:none !important }

  /* ── Colores por sección ── */
  :root { --c-plata:#059669; --c-mes:#2563eb; --c-pend:#d97706; --c-pagar:#dc2626; --c-cobrar:#7c3aed; --c-viene:#0891b2; --c-ano:#4f46e5; --c-datos:#64748b; }
  @media (prefers-color-scheme: dark) { :root { --c-plata:#34d399; --c-mes:#60a5fa; --c-pend:#fbbf24; --c-pagar:#f87171; --c-cobrar:#a78bfa; --c-viene:#22d3ee; --c-ano:#818cf8; --c-datos:#94a3b8; } }
  .b-plata { --c:var(--c-plata) } .b-mes { --c:var(--c-mes) } .b-pend { --c:var(--c-pend) } .b-pagar { --c:var(--c-pagar) }
  .b-cobrar { --c:var(--c-cobrar) } .b-viene { --c:var(--c-viene) } .b-ano { --c:var(--c-ano) } .b-datos { --c:var(--c-datos) }
  .bloque h2 { color:var(--c); display:flex; align-items:center; gap:8px }
  .bloque h2::before { content:""; width:10px; height:10px; border-radius:3px; background:var(--c) }
  .bloque .card { border-left:4px solid var(--c) }
  .bloque .v:not(.ok):not(.bad):not(.amar) { color:var(--c) }
  .bloque .rejilla .card { background:color-mix(in srgb, var(--c) 7%, var(--card)) }
  .bloque details summary { color:var(--c) }
  .bloque .barra i { background:var(--c) }
  .bloque .meses b { background:color-mix(in srgb, var(--c) 35%, var(--card)) } .bloque .meses .hoy b { background:var(--c) }
  /* Encabezado y tarjeta principal */
  .cabeza { background:linear-gradient(135deg, #1d4ed8, #4f46e5 60%, #7c3aed); color:#fff; border-radius:16px; padding:16px 18px; margin-bottom:6px }
  .cabeza h1 { margin:0 } .cabeza .sub { color:rgba(255,255,255,.85) }
  .heroe { background:linear-gradient(135deg, #059669, #0891b2) !important; color:#fff; border:0 !important }
  .heroe .k { color:rgba(255,255,255,.85) } .heroe .v, .bloque .heroe .v:not(.ok):not(.bad):not(.amar) { color:#fff }
  /* Etiquetas rellenas */
  .etq { border:0; padding:2px 9px } .etq.bad { background:color-mix(in srgb, var(--bad) 14%, var(--card)) }
  .etq.amar { background:color-mix(in srgb, var(--amar) 16%, var(--card)) } .etq.ok { background:color-mix(in srgb, var(--ok) 14%, var(--card)) }
  .etq.mut { background:color-mix(in srgb, var(--mut) 14%, var(--card)) }
  /* Pantalla de clave */
  .logo { width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg, #1d4ed8, #7c3aed); display:grid; place-items:center; margin-bottom:12px }
  button:not(.sec) { background:linear-gradient(135deg, #1d4ed8, #4f46e5) }
</style>
</head>
<body>
<main>
  <section id="candado">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><path d="M16 48V32M28 48V20M40 48V28M52 48V14" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg></div>
    <h1>Resumen</h1>
    <div class="mut">Escriba la clave para ver los números.</div>
    <form id="formClave" autocomplete="off">
      <input type="password" id="clave" placeholder="Clave" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Clave">
      <label><input type="checkbox" id="recordar"> Recordar en este celular</label>
      <button type="submit" id="btnAbrir">Abrir</button>
    </form>
    <div id="error" role="alert"></div>
  </section>
  <section id="contenido" class="oculto"></section>
</main>

const PAQUETE = JSON.parse(document.getElementById("paquete").textContent);
const GUARDA = "resumen-clave";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MC = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const $ = id => document.getElementById(id);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pesos = n => (n < 0 ? "−" : "") + "$" + Math.abs(Math.round(n || 0)).toLocaleString("es-CO");
const pct = x => x == null ? "—" : Math.round(x * 100) + " %";
const dia = f => { if (!f) return "—"; const [a, m, d] = f.slice(0, 10).split("-"); return `${+d} ${MC[m - 1]}`; };
const color = n => n < 0 ? "bad" : "";
const fila = (izq, der, cls = "") => `<div class="fila"><div class="q">${izq}</div><div class="n ${cls}">${der}</div></div>`;
const nombreCorto = s => esc(String(s || "").replace(/\s+(S\.?A\.?S\.?|SAS|LTDA\.?|S\.A\.?)(\s|$).*$/i, "").trim());

function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function descifrar(clave) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(clave.normalize("NFC").trim()), "PBKDF2", false, ["deriveKey"]);
  const llave = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(PAQUETE.sal), iterations: PAQUETE.iteraciones, hash: "SHA-256"},
                                              base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(PAQUETE.iv)}, llave, b64(PAQUETE.datos));
  return JSON.parse(new TextDecoder().decode(plano));
}

function leerGuardada() { try { return localStorage.getItem(GUARDA); } catch (e) { return null; } }
function guardar(c) { try { localStorage.setItem(GUARDA, c); } catch (e) {} }
function olvidar() { try { localStorage.removeItem(GUARDA); } catch (e) {} }

async function abrir(clave, recordar) {
  const D = await descifrar(clave);
  if (recordar) guardar(clave);
  $("candado").classList.add("oculto");
  $("contenido").classList.remove("oculto");
  $("contenido").innerHTML = pintar(D);
  const b = $("btnOlvidar");
  if (b) b.onclick = () => { olvidar(); location.reload(); };
}

$("formClave").addEventListener("submit", async ev => {
  ev.preventDefault();
  const clave = $("clave").value;
  if (!clave.trim()) return;
  $("btnAbrir").disabled = true; $("btnAbrir").textContent = "Abriendo…"; $("error").textContent = "";
  try { await abrir(clave, $("recordar").checked); }
  catch (e) {
    $("error").textContent = (window.crypto && crypto.subtle) ? "Clave incorrecta." : "Este navegador no puede abrir la página. Pruebe con Chrome o Safari.";
    $("btnAbrir").disabled = false; $("btnAbrir").textContent = "Abrir";
  }
});

(async () => {
  const c = leerGuardada();
  if (!c) return;
  try { await abrir(c, false); } catch (e) { olvidar(); }
})();

/* ── Pintar ─────────────────────────────────────────────────────────── */
function edad(D) {
  const horas = (Date.now() - new Date(D.generado).getTime()) / 36e5;
  const [f, h] = D.generado.split("T");
  const [hh, mm] = h.split(":").map(Number);
  const hora = `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, "0")} ${hh < 12 ? "a. m." : "p. m."}`;
  const cabeza = `<div class="cabeza"><h1>${esc(D.negocio)}</h1><div class="sub">Números al ${dia(f)}, ${hora}</div></div>`;
  if (horas >= 48) return cabeza + `<div class="card aviso"><b>Esta foto tiene ${Math.floor(horas / 24)} días.</b> <span class="sub">Se actualiza cuando cierre la app en el PC con internet.</span></div>`;
  return cabeza;
}

const bloque = (clase, html) => `<section class="bloque ${clase}">${html}</section>`;

function seccionPlata(p) {
  const filas = [fila("Banco",pesos(p.banco), color(p.banco))].concat(
    p.bolsillos.map(b => fila(esc(b.nombre), pesos(b.saldo), color(b.saldo))));
  return `<h2>Plata disponible</h2>
    <div class="card heroe"><div class="k">Banco + efectivo</div><div class="v grande ${color(p.disponible)}">${pesos(p.disponible)}</div></div>
    <div class="card">${filas.join("")}</div>
    <div class="nota">El efectivo cuenta lo que se mueve desde el corte del ${dia(p.corte)}. El banco sale del último extracto cargado.</div>`;
}

function seccionMes(D) {
  const m = D.mes, a = D.anterior, eq = D.equilibrio;
  let h = `<h2>${MESES[m.mes - 1]} · va en curso</h2>
    <div class="rejilla">
      <div class="card"><div class="k">Ventas (con IVA)</div><div class="v">${pesos(m.ventas_con_iva)}</div></div>
      <div class="card"><div class="k">Utilidad bruta</div><div class="v ${color(m.utilidad_bruta)}">${pesos(m.utilidad_bruta)}</div></div>
      <div class="card"><div class="k">Gastos</div><div class="v">${pesos(m.gastos + m.intereses)}</div></div>
      <div class="card"><div class="k">Utilidad neta</div><div class="v ${color(m.utilidad_neta)}">${pesos(m.utilidad_neta)}</div></div>
    </div>`;
  if (eq && eq.ventas_con_iva) {
    const av = Math.max(0, Math.min(1, eq.avance || 0));
    h += `<div class="card" style="margin-top:10px"><div class="k">Para cubrir los gastos del mes hay que vender unos ${pesos(eq.ventas_con_iva)}</div>
      <div class="barra"><i style="width:${(av * 100).toFixed(1)}%"></i></div>
      <div class="sub" style="margin-top:6px">Lleva ${pct(eq.avance)} (${pesos(m.ventas_con_iva)})</div></div>`;
  }
  if (a) h += `<div class="card">${fila(`${MESES[a.mes - 1][0].toUpperCase() + MESES[a.mes - 1].slice(1)} completo · ventas`, pesos(a.ventas_con_iva))}
      ${fila("Utilidad bruta", pesos(a.utilidad_bruta), color(a.utilidad_bruta))}
      ${fila("Utilidad neta", pesos(a.utilidad_neta), color(a.utilidad_neta))}</div>`;
  h += `<div class="nota">Sin IVA, salvo donde dice. Los gastos del mes se van cargando: la utilidad real del mes se ve al cerrarlo.</div>`;
  return h;
}

function seccionPagar(p) {
  const hoy = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);   // fecha local
  const lista = p.facturas.map(f => fila(`${nombreCorto(f.proveedor)}<div class="sub">${f.vencida ? "Venció" : "Vence"} ${dia(f.vence)}${f.fuente && f.fuente !== "WO" ? " · aún no está en WO" : ""}</div>`,
                                          pesos(f.saldo), f.vencida ? "bad" : (f.vence <= hoy ? "amar" : "")));
  const prov = p.proveedores.map(x => fila(`${nombreCorto(x.proveedor)}<div class="sub">${x.facturas} factura${x.facturas === 1 ? "" : "s"}${x.proximo ? " · próxima " + dia(x.proximo) : ""}</div>`,
                                           pesos(x.saldo) + (x.vencido ? `<div class="sub bad">${pesos(x.vencido)} vencido</div>` : "")));
  return `<h2>Por pagar a proveedores</h2>
    <div class="rejilla">
      <div class="card"><div class="k">Deuda total</div><div class="v">${pesos(p.total)}</div></div>
      <div class="card"><div class="k">Vencido</div><div class="v ${p.vencido ? "bad" : "ok"}">${p.vencido ? pesos(p.vencido) : "Nada"}</div></div>
    </div>
    <div class="card" style="margin-top:10px"><div class="k">Vence en los próximos 7 días: <b>${pesos(p.prox_7)}</b></div></div>
    <div class="card"><div class="k" style="margin-bottom:4px">Vencidas y las que vencen en ${p.dias} días</div>${lista.join("") || '<div class="sub">Nada.</div>'}</div>
    <div class="card"><details><summary>Por proveedor (${p.proveedores.length})</summary>${prov.join("")}</details></div>
    <div class="nota">Según el Estado de Cuenta de WO del ${dia(p.corte)}, menos los pagos registrados después.</div>`;
}

function seccionCobrar(c) {
  const filas = c.deudores.map(d => fila(`${esc(d.cliente)}<div class="sub">Última venta ${dia(d.ultima_venta)}${d.ultimo_pago ? " · último pago " + dia(d.ultimo_pago) : ""}</div>`, pesos(d.saldo)));
  return `<h2>Por cobrar a clientes</h2>
    <div class="card"><div class="k">Le deben</div><div class="v">${pesos(c.total)}</div></div>
    <div class="card">${filas.join("") || '<div class="sub">Nadie le debe.</div>'}</div>`;
}

function seccionPendientes(lista) {
  const orden = {VENCIDO: 0, HOY: 1, PENDIENTE: 2, HECHO: 3};
  const etq = e => ({VENCIDO: '<span class="etq bad">Vencido</span>', HOY: '<span class="etq amar">Hoy</span>',
                     PENDIENTE: '<span class="etq mut">Pendiente</span>', HECHO: '<span class="etq ok">Hecho</span>'}[e] || esc(e));
  const per = o => { const [a, m] = o.periodo.split("-"); return MC[m - 1] + " " + a; };
  const una = o => fila(`${esc(o.nombre)}<div class="sub">${o.estado === "HECHO" ? "Hecho el " + dia(o.hecho_el) : "Vence " + dia(o.vence)} · ${per(o)}</div>`, etq(o.estado));
  const falta = lista.filter(o => o.estado !== "HECHO").sort((a, b) => orden[a.estado] - orden[b.estado] || a.vence.localeCompare(b.vence));
  const hechas = lista.filter(o => o.estado === "HECHO");
  return `<h2>Pendientes del mes</h2>
    <div class="card">${falta.map(una).join("") || '<div class="sub">Todo al día.</div>'}
      ${hechas.length ? `<details><summary>Ya hechos (${hechas.length})</summary>${hechas.map(una).join("")}</details>` : ""}</div>`;
}

function seccionProyeccion(pr, plata) {
  const nombres = {facturas: "Facturas de proveedores", gastos: "Gastos (promedio)", intereses: "Intereses", retencion: "Retención en la fuente", iva: "IVA"};
  const det = Object.entries(pr.detalle).filter(([, v]) => v).map(([k, v]) => fila(nombres[k] || esc(k), pesos(v)));
  return `<h2>Lo que viene</h2>
    <div class="card">${fila("Falta pagar este mes (facturas)", pesos(pr.este_mes))}</div>
    <div class="card"><div class="k">${MESES[pr.mes - 1][0].toUpperCase() + MESES[pr.mes - 1].slice(1)}: hay que pagar unos</div><div class="v">${pesos(pr.pagar)}</div>
      <details><summary>Detalle</summary>${det.join("")}</details>
      ${fila("Ventas esperadas (con IVA)", pesos(pr.ventas_esperadas))}
      ${fila("Diferencia", pesos(pr.diferencia), color(pr.diferencia))}
      ${fila("La plata de hoy cubre", pct(pr.cobertura), pr.cobertura != null && pr.cobertura < 1 ? "amar" : "ok")}</div>
    <div class="nota">Estimado con el promedio de los últimos meses cerrados. No incluye compras nuevas.</div>`;
}

function seccionAno(D) {
  const y = D.ano, s = D.serie;
  const max = Math.max(1, ...s.map(x => x.ventas_con_iva));
  const barras = s.map(x => `<div class="${x.mes === D.mes.mes ? "hoy" : ""}"><em>${(x.ventas_con_iva / 1e6).toLocaleString("es-CO", {maximumFractionDigits: 0})}</em>
      <b style="height:${Math.max(2, x.ventas_con_iva / max * 100)}%"></b><span>${MC[x.mes - 1]}</span></div>`).join("");
  return `<h2>Año ${y.anio}</h2>
    <div class="card"><div class="k">Ventas por mes (millones, con IVA)</div><div class="meses">${barras}</div></div>
    <div class="card">${fila("Ventas (con IVA)", pesos(y.ventas_con_iva))}${fila("Utilidad bruta", pesos(y.utilidad_bruta), color(y.utilidad_bruta))}
      ${fila("Gastos e intereses", pesos(y.gastos + y.intereses))}${fila("Utilidad neta", pesos(y.utilidad_neta), color(y.utilidad_neta))}</div>`;
}

function seccionDatos(lista) {
  const filas = lista.map(d => fila(`${esc(d.nombre)}`, d.fecha ? `${dia(d.fecha)}<div class="sub ${d.vieja ? "amar" : ""}">${d.dias === 0 ? "hoy" : "hace " + d.dias + " d"}</div>` : '<span class="amar">Nunca</span>', d.vieja ? "amar" : ""));
  return `<h2>Qué tan al día están los datos</h2><div class="card">${filas.join("")}</div>`;
}

function pintar(D) {
  return `${edad(D)}
    ${bloque("b-plata", seccionPlata(D.plata))}
    ${bloque("b-mes", seccionMes(D))}
    ${bloque("b-pend", seccionPendientes(D.pendientes))}
    ${bloque("b-pagar", seccionPagar(D.pagar))}
    ${bloque("b-cobrar", seccionCobrar(D.cobrar))}
    ${bloque("b-viene", seccionProyeccion(D.proyeccion, D.plata))}
    ${bloque("b-ano", seccionAno(D))}
    ${bloque("b-datos", seccionDatos(D.datos))}
    <div class="nota" style="margin-top:24px">Solo para consultar. Se actualiza cuando cierra la app en el PC con internet.</div>
    <button class="sec" id="btnOlvidar">Salir y olvidar la clave en este celular</button>`;
}
</script>
